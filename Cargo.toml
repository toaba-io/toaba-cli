[package]
name = "toaba-cli"
version = "0.2.0"
edition = "2024"
description = "The command-line tool for Toaba, the PaaS for live games"
license = "Apache-2.0"
repository = "https://github.com/toaba-io/toaba-cli"

[[bin]]
name = "toaba"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dialoguer = { version = "0.12.0", default-features = false }
futures-util = "0.3.34"
globset = "0.4.21"
indicatif = "0.18.6"
mime_guess = "2.0.5"
oauth2 = "5.0.0"
open = "5.4.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slug = "0.1.6"
timeago = { version = "0.6.1", default-features = false }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"
walkdir = "2.5.0"

[dev-dependencies]
wiremock = "0.6.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
