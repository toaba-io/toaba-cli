[package]
name = "toaba-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "toaba"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dialoguer = { version = "0.12.0", default-features = false }
indicatif = "0.18.6"
oauth2 = "5.0.0"
open = "5.4.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1.2.1"

[dev-dependencies]
wiremock = "0.6.5"
